services:
  - type: web
    name: gcarbon-calling-server
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: gcarbon_calling
      - key: ALLOWED_ORIGIN
        sync: false
      - key: SHAREPOINT_EXCEL_URL
        sync: false
      - key: SHAREPOINT_COOKIES
        sync: false
